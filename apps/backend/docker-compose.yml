version: '3.8'

services:
  backend:
    build:
      context: .
      target: production
    container_name: homechef_backend
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Pass existing supabase/auth variables through (set in your actual host env)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
